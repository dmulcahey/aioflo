---
name: "Publish to PyPI"

on:
  push:
    tags:
      - "*"

jobs:
  publish_to_pypi:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Publish to PyPI
        run: |
          pip install poetry
          poetry publish --build -u __token__ -p  ${{ secrets.PYPI_API_KEY }}
